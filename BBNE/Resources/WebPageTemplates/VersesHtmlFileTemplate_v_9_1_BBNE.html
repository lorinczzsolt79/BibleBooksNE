  <style>
    .vCSS_Version::after {
      content: "v.014_2026-08-19";

    html,
    body {
      color: var(--textColor);
      background-color: var(--bgColor);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
    }

    header,
    main,
    footer {
      margin: 10px;
    }

    details {
      margin: 10px;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--myColor);
      padding: 0;
      display: inline;
    }

    sup {
      font-size: small;
    }

    label {
      padding-left: 5px;
    }

    input[type="radio"] {
      width: 18px;
      height: 18px;
    }

    nav {
      margin: 10px;
    }

    .readerStyle {
      display: block;
    }

    .navi {
      padding-right: 10px;
    }

    .footnote {
      display: block;
    }

    section {
      display: flex;
      flex-direction: row;
    }

    .group {
      display: block;
    }

    .marker {
      margin: 0 3px;
    }

    .normal,
    .selected {
      margin: 4px;
      padding: 4px;
      width: 100%;
    }

    .normal {
      color: var(--TextColor);
      background-color: var(--BgColor);
      border: solid 1px transparent;
    }

    .selected {
      color: var(--sTextColor);
      background-color: var(--sBgColor);
      border: solid 1px var(--borderColor);
    }

    .headline {
      margin: 2px;
      display: block;
    }

    .verse {
      display: block;
    }

    .bbchId {
      display: inline;
      color: var(--myColor);
      font-weight: bold;
    }

    .verseId {
      display: inline;
      color: var(--myColor);
      font-weight: bold;
      padding: 0 2px;
    }

    .invId {
      visibility: hidden;
      display: none;
    }

    .crossReferences {
      font-size: small;
      display: block;
    }

    /* COLORS */

    :root {
      --textColor: white;
      --bgColor: black;
      --sTextColor: whitesmoke;
      --sBgColor: rgb(30, 30, 30);
      --borderColor: gray;
      --myColor: rgb(255, 185, 0);
    }

    .red {
      color: red;
    }

    a {
      text-decoration: none;
    }

    a:link,
    #lTop {
      color: rgb(0, 185, 0)
    }

    a:active {
      color: yellow
    }

    a:visited {
      color: aqua
    }

    abbr {
      color: blueviolet;
    }

    .green {
      color: green;
    }

    /* Tables */

    table {
      text-align: center;
      border: solid 1px var(--borderColor);
    }

    th,
    td {
      padding: 5px;
      border: solid 1px var(--borderColor);
    }

    th {
      color: var(--myColor);
      background-color: var(--bgColor);
    }

    .inv {
      color: var(--textColor);
      background-color: var(--bgColor);
    }

    #except {
      color: var(--myColor);
    }

    .myColor {
      color: var(--myColor);
    }

    .bolder {
      font-weight: bolder;
    }

    .highlighted {
      background-color: cornflowerblue;
      color: yellow;
      padding: 1px 5px;
    }
